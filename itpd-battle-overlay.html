<!DOCTYPE html>
<!--
  ITPD reaction battle overlay.
  Based on Social Stream Ninja's reactions.html (https://github.com/steveseguin/social_stream),
  Copyright Steve Seguin and contributors, licensed under the GNU GPL v3. This modified copy
  is also GPL v3. Changes (In The Park Daze, 2026-10-23): a hook in processPayload that passes
  each reaction to the battle counter, an optional switch to hide the floating reactions
  (#nofloat), and the battle scoreboard script at the end of this file. SSN's connection code
  is unchanged. Needs js/local-server-url.js and shared/overlay-control-transport.js from SSN
  next to it, at those paths.

  LINK (IRLToolkit browser source, 1920x1080):
    itpd-battle-overlay.html?session=SSN_SESSION&v=3.50.25&server&server2#url=https://charming-worm-109173.upstash.io&tok=READ_WRITE_TOKEN
  The part before # is exactly what SSN's own reactions overlay link uses. After #: Upstash
  settings, plus optional &pos=bottom, &scale=1.2, &nofloat (scoreboard only).
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Reactions Overlay. Part of the Social Stream Ninja toolkit for managing live chat, stream overlays and audience interactions.">
    <meta name="robots" content="noindex">
  <script type="text/javascript" src="./js/local-server-url.js"></script>
  <script src="./shared/overlay-control-transport.js"></script>

	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Social Stream - Reactions Overlay</title>
	<link rel="icon" href="./favicon.ico">
	<style>
html, body {
	margin: 0;
	padding: 0;
	width: 100%;
	height: 100%;
	overflow: hidden;
	background: transparent;
}

body {
	font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
}

#stage {
	position: fixed;
	inset: 0;
	overflow: hidden;
	pointer-events: none;
}

.reaction {
	position: absolute;
	bottom: -14vh;
	opacity: 0;
	will-change: transform, opacity;
	animation-name: float-up;
	animation-timing-function: linear;
	animation-fill-mode: forwards;
	filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.35));
}

.reaction-content {
	width: 100%;
	height: 100%;
	display: flex;
	align-items: center;
	justify-content: center;
	transform-origin: center;
	animation: sway 1.1s ease-in-out infinite alternate;
}

.reaction-content img,
.reaction-content svg {
	width: 100% !important;
	height: 100% !important;
	max-width: none !important;
	max-height: none !important;
	display: block;
	object-fit: contain;
}

.reaction-heart {
	line-height: 1;
	font-size: 1em;
	text-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
}

.setup-note {
	position: fixed;
	left: 50%;
	top: 50%;
	transform: translate(-50%, -50%);
	padding: 12px 16px;
	border-radius: 12px;
	background: rgba(0, 0, 0, 0.6);
	color: #fff;
	font-size: 15px;
	letter-spacing: 0.01em;
	box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
}

.hidden {
	display: none;
}

@keyframes float-up {
	0% {
		opacity: 0;
		transform: translate3d(0, 0, 0) scale(0.72) rotate(0deg);
	}
	10% {
		opacity: 1;
	}
	100% {
		opacity: 0;
		transform: translate3d(var(--drift, 0vw), -116vh, 0) scale(1.18) rotate(var(--spin, 0deg));
	}
}

@keyframes sway {
	from {
		transform: translateX(-2px) rotate(-6deg);
	}
	to {
		transform: translateX(2px) rotate(6deg);
	}
}
	</style>
</head>
<body>
	<div id="stage"></div>
	<div id="setup-note" class="setup-note hidden">Add <code>?session=YOUR_SESSION_ID</code> to use this page.</div>

	<script>
(function () {
	"use strict";

	var urlParams = new URLSearchParams(window.location.search);
	var SERVER_EXCLUSIVE_TRANSPORT_VERSION = "3.52.0";
	// Transport migration guard: only pages with full server parity may skip the legacy bridge.
	var TRANSPORT_CAPABILITIES = {
		serverFeed: true,
		serverTargeted: false,
		upstreamCommands: false,
		customChannel: false,
		legacyBridgeRequired: true,
		legacyBridgeReason: "Reaction payloads are still targeted through sendTargetP2P."
	};
	function versionAtLeast(value, minimum) {
		var a = String(value || "").split(".");
		var b = String(minimum || "").split(".");
		var len = Math.max(a.length, b.length);
		for (var i = 0; i < len; i++) {
			var av = parseInt(a[i], 10) || 0;
			var bv = parseInt(b[i], 10) || 0;
			if (av > bv) return true;
			if (av < bv) return false;
		}
		return true;
	}
	// Only feed-carrying server params listed by this page may disable the bridge; server3 alone is command-only.
	function hasExclusiveServerTransport(caps) {
		var params = caps && typeof caps.exclusiveServerParams === "object" ? caps.exclusiveServerParams : { server2: true };
		return (params.server === true && urlParams.has("server")) ||
			(params.server2 !== false && urlParams.has("server2")) ||
			(params.server3 === true && urlParams.has("server2") && urlParams.has("server3"));
	}
	function useServerOnlyTransport() {
		var caps = (typeof TRANSPORT_CAPABILITIES === "object" && TRANSPORT_CAPABILITIES) ? TRANSPORT_CAPABILITIES : {};
		return hasExclusiveServerTransport(caps) &&
			versionAtLeast(urlParams.get("v"), SERVER_EXCLUSIVE_TRANSPORT_VERSION) &&
			caps.serverFeed === true &&
			caps.legacyBridgeRequired !== true &&
			caps.upstreamCommands !== true &&
			caps.customChannel !== true;
	}
	var sessionId = urlParams.get("session") || urlParams.get("room") || "";
	var password = urlParams.get("password") || "false";
	var label = urlParams.get("label") || "reactions";
	var outChannel = parseInt(urlParams.get("out") || urlParams.get("outchan") || "3", 10);
	var inChannel = parseInt(urlParams.get("in") || urlParams.get("inchan") || "4", 10);
	var scaleSetting = parseFloat(urlParams.get("scale") || "1");
	var speedSetting = parseFloat(urlParams.get("speed") || "1");
	var burstSetting = parseInt(urlParams.get("burst") || "6", 10);
	var limitSetting = parseInt(urlParams.get("limit") || "60", 10);
	var pageBackground = urlParams.get("pagebg");
	var alignSetting = normalizeAlign(urlParams.get("align"));
	var layoutSetting = normalizeLayout(urlParams.get("layout"));
	var centerOriginSetting = readBooleanParam("centerorigin");
	var tripleSetting = readBooleanParam("triple");
	var stage = document.getElementById("stage");
	var setupNote = document.getElementById("setup-note");
	var recentMessages = [];
	var spawnHistory = [];

	if (!isFinite(outChannel)) {
		outChannel = 3;
	}
	if (!isFinite(inChannel)) {
		inChannel = 4;
	}
	if (!isFinite(scaleSetting) || scaleSetting <= 0) {
		scaleSetting = 1;
	}
	if (!isFinite(speedSetting) || speedSetting <= 0) {
		speedSetting = 1;
	}
	if (!isFinite(burstSetting) || burstSetting < 1) {
		burstSetting = 6;
	}
	if (!isFinite(limitSetting) || limitSetting < 10) {
		limitSetting = 60;
	}
	if (pageBackground) {
		document.body.style.background = pageBackground;
	}
	if (!sessionId) {
		setupNote.classList.remove("hidden");
	}

	stage.setAttribute("data-align", alignSetting || "full");
	stage.setAttribute("data-layout", layoutSetting);

	function clamp(value, min, max) {
		return Math.max(min, Math.min(max, value));
	}

	function randomBetween(min, max) {
		return min + Math.random() * (max - min);
	}

	function readBooleanParam(name) {
		var value;
		if (!urlParams.has(name)) {
			return false;
		}
		value = String(urlParams.get(name) || "").toLowerCase();
		if (!value || value === "1" || value === "true" || value === "yes" || value === "on") {
			return true;
		}
		if (value === "0" || value === "false" || value === "no" || value === "off") {
			return false;
		}
		return true;
	}

	function normalizeAlign(value) {
		value = typeof value === "string" ? value.toLowerCase() : "";
		if (value === "left" || value === "center" || value === "right") {
			return value;
		}
		return "";
	}

	function normalizeLayout(value) {
		value = typeof value === "string" ? value.toLowerCase() : "";
		if (value === "column" || value === "fountain") {
			return value;
		}
		return "spread";
	}

	function normalizeEventName(value) {
		if (typeof value !== "string") {
			return "";
		}
		return value.toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "");
	}

	function decodeHtmlText(value) {
		var temp;
		if (typeof value !== "string" || !value) {
			return "";
		}
		temp = document.createElement("div");
		temp.innerHTML = value;
		return (temp.textContent || temp.innerText || "").replace(/\s+/g, " ").trim();
	}

	function extractLikeCount(payload) {
		var text = decodeHtmlText(payload && payload.chatmessage);
		var match;
		var numeric;
		var value;
		if (!text) {
			return null;
		}
		match = text.match(/(\d[\d,\.]*)/);
		if (!match) {
			return null;
		}
		numeric = match[1].replace(/[^\d]/g, "");
		if (!numeric) {
			return null;
		}
		value = parseInt(numeric, 10);
		return isFinite(value) && value > 0 ? value : null;
	}

	function buildSignature(payload) {
		return [
			normalizeEventName(payload && payload.event),
			payload && payload.type ? payload.type : "",
			(payload && (payload.userid || payload.username || payload.chatname)) || "",
			payload && payload.chatmessage ? payload.chatmessage : "",
			payload && payload.id ? payload.id : ""
		].join("|");
	}

	function wasSeenRecently(payload) {
		var now = Date.now();
		var signature = buildSignature(payload);
		var i;

		for (i = recentMessages.length - 1; i >= 0; i--) {
			if (recentMessages[i].expiresAt <= now) {
				recentMessages.splice(i, 1);
			}
		}

		for (i = 0; i < recentMessages.length; i++) {
			if (recentMessages[i].signature === signature) {
				return true;
			}
		}

		recentMessages.push({
			signature: signature,
			expiresAt: now + 2500
		});

		return false;
	}

	function getHorizontalBounds() {
		if (alignSetting === "left") {
			return { min: 6, max: 36 };
		}
		if (alignSetting === "center") {
			return { min: 32, max: 68 };
		}
		if (alignSetting === "right") {
			return { min: 64, max: 94 };
		}
		return { min: 10, max: 90 };
	}

	function getAnchor(bounds) {
		return clamp((bounds.min + bounds.max) / 2, 6, 94);
	}

	function getMotion(kind) {
		var bounds = getHorizontalBounds();
		var anchor = getAnchor(bounds);
		var left;
		var driftMin;
		var driftMax;
		var durationMin = kind === "like" ? 3.8 : 3.2;
		var durationMax = kind === "like" ? 5.8 : 4.9;
		var spinRange = 18;

		if (centerOriginSetting) {
			left = 50;
			if (layoutSetting === "column") {
				driftMin = -4;
				driftMax = 4;
				durationMin += 0.3;
				durationMax += 0.5;
				spinRange = 8;
			} else if (layoutSetting === "fountain") {
				driftMin = -20;
				driftMax = 20;
				durationMin -= 0.2;
				durationMax -= 0.1;
				spinRange = 22;
			} else {
				driftMin = -16;
				driftMax = 16;
			}
		} else if (layoutSetting === "column") {
			left = randomBetween(Math.max(bounds.min, anchor - 6), Math.min(bounds.max, anchor + 6));
			driftMin = -4;
			driftMax = 4;
			durationMin += 0.3;
			durationMax += 0.5;
			spinRange = 8;
		} else if (layoutSetting === "fountain") {
			left = randomBetween(Math.max(bounds.min, anchor - 8), Math.min(bounds.max, anchor + 8));
			if (alignSetting === "left") {
				driftMin = -4;
				driftMax = 24;
			} else if (alignSetting === "right") {
				driftMin = -24;
				driftMax = 4;
			} else {
				driftMin = -20;
				driftMax = 20;
			}
			durationMin -= 0.2;
			durationMax -= 0.1;
			spinRange = 22;
		} else {
			left = randomBetween(bounds.min, bounds.max);
			if (alignSetting === "left") {
				driftMin = -8;
				driftMax = 16;
			} else if (alignSetting === "right") {
				driftMin = -16;
				driftMax = 8;
			} else {
				driftMin = -16;
				driftMax = 16;
			}
		}

		return {
			left: clamp(left, 4, 96),
			drift: randomBetween(driftMin, driftMax),
			spin: randomBetween(-spinRange, spinRange),
			duration: Math.max(1.4, randomBetween(durationMin, durationMax) / speedSetting)
		};
	}

	function trimStage() {
		while (stage.children.length >= limitSetting) {
			stage.removeChild(stage.firstChild);
		}
	}

	function recordSpawn(options) {
		spawnHistory.push({
			size: options.size,
			left: options.left,
			duration: options.duration,
			drift: options.drift,
			spin: options.spin,
			align: alignSetting || "full",
			layout: layoutSetting,
			centerOrigin: centerOriginSetting,
			event: options.event || ""
		});
		if (spawnHistory.length > 400) {
			spawnHistory.splice(0, spawnHistory.length - 400);
		}
	}

	function createReaction(markup, className, options) {
		var item = document.createElement("div");
		var content = document.createElement("div");
		var size = clamp(options.size || 48, 18, 240);
		var left = clamp(options.left || 50, -5, 105);
		var duration = Math.max(1.4, options.duration || 4.5);
		var drift = options.drift || 0;
		var spin = options.spin || 0;

		item.className = "reaction";
		item.style.width = size + "px";
		item.style.height = size + "px";
		item.style.fontSize = size + "px";
		item.style.left = left + "vw";
		if (centerOriginSetting) {
			item.style.marginLeft = (-size / 2) + "px";
		}
		item.style.animationDuration = duration + "s";
		item.style.setProperty("--drift", drift + "vw");
		item.style.setProperty("--spin", spin + "deg");
		item.dataset.left = String(left);
		item.dataset.drift = String(drift);
		item.dataset.layout = layoutSetting;
		item.dataset.align = alignSetting || "full";
		item.dataset.centerOrigin = centerOriginSetting ? "true" : "false";

		content.className = "reaction-content" + (className ? " " + className : "");
		content.innerHTML = markup;
		forceMediaToFill(content);
		item.appendChild(content);

		recordSpawn({
			size: size,
			left: left,
			duration: duration,
			drift: drift,
			spin: spin,
			event: options.event || ""
		});

		trimStage();
		stage.appendChild(item);
		item.addEventListener("animationend", function () {
			if (item.parentNode) {
				item.parentNode.removeChild(item);
			}
		});
	}

	function forceMediaToFill(container) {
		var media = container.querySelectorAll("img,svg");
		var i;

		for (i = 0; i < media.length; i++) {
			media[i].removeAttribute("width");
			media[i].removeAttribute("height");
			media[i].style.setProperty("width", "100%", "important");
			media[i].style.setProperty("height", "100%", "important");
			media[i].style.setProperty("max-width", "none", "important");
			media[i].style.setProperty("max-height", "none", "important");
		}
	}

	function createHeartMarkup(index) {
		var hearts = [
			"&#10084;&#65039;",
			"&#x1F9E1;",
			"&#x1F49B;",
			"&#x1F49A;",
			"&#x1F499;",
			"&#x1F496;"
		];
		return "<span class='reaction-heart'>" + hearts[index % hearts.length] + "</span>";
	}

	function getReleaseMultiplier() {
		return tripleSetting ? 3 : 1;
	}

	function spawnLikeBurst(payload) {
		var likeCount = extractLikeCount(payload);
		var total = burstSetting;
		var i;

		if (likeCount) {
			total = clamp(Math.round(Math.log(likeCount + 1) * 4), Math.max(4, burstSetting), 20);
		}

		total = clamp(total * getReleaseMultiplier(), 1, Math.max(limitSetting, 60));

		for (i = 0; i < total; i++) {
			(function (index) {
				setTimeout(function () {
					var motion = getMotion("like");
					createReaction(createHeartMarkup(index), "", {
						size: randomBetween(28, 56) * scaleSetting,
						left: motion.left,
						duration: motion.duration,
						drift: motion.drift,
						spin: motion.spin,
						event: "liked"
					});
				}, index * randomBetween(45, 110));
			})(i);
		}
	}

	function fallbackReactionMarkup(payload) {
		var text = decodeHtmlText(payload && payload.chatmessage).toLowerCase();
		if (text.indexOf("thumb") !== -1) {
			return "<span class='reaction-heart'>&#128077;</span>";
		}
		if (text.indexOf("heart") !== -1 || text.indexOf("like") !== -1) {
			return "<span class='reaction-heart'>&#10084;&#65039;</span>";
		}
		return "<span class='reaction-heart'>&#10024;</span>";
	}

	function escapeReactionAttribute(value) {
		return String(value || "").replace(/[&<>"']/g, function(character) {
			return {
				"&": "&amp;",
				"<": "&lt;",
				">": "&gt;",
				'"': "&quot;",
				"'": "&#039;"
			}[character];
		});
	}

	function spawnSingleReaction(payload) {
		var markup = typeof payload.chatmessage === "string" ? payload.chatmessage : "";
		var total = getReleaseMultiplier();
		var i;

		if (!markup || markup.indexOf("<") === -1) {
			if (payload && typeof payload.contentimg === "string" && payload.contentimg) {
				markup = "<img alt='reaction' src='" + escapeReactionAttribute(payload.contentimg) + "'>";
			} else {
				markup = fallbackReactionMarkup(payload);
			}
		}

		for (i = 0; i < total; i++) {
			(function (index) {
				setTimeout(function () {
					var motion = getMotion("reaction");
					createReaction(markup, "", {
						size: randomBetween(38, 72) * scaleSetting,
						left: motion.left,
						duration: motion.duration,
						drift: motion.drift,
						spin: motion.spin,
						event: "reaction"
					});
				}, index * randomBetween(30, 80));
			})(i);
		}
	}

    if (label === 'reactions') SSNOverlayControl.connect(urlParams, sessionId, 'reactions', processPayload);
	function processPayload(raw) {
		var payload = raw;
		var eventName;

		if (!payload || typeof payload !== "object") {
			return false;
		}
		if (payload.dataReceived && payload.dataReceived.overlayNinja) {
			payload = payload.dataReceived.overlayNinja;
		}
		if (payload.overlayNinja) {
			payload = payload.overlayNinja;
		}
		if (!payload || typeof payload !== "object") {
			return false;
		}

        if (!SSNOverlayControl.accept(payload, 'reactions')) return false;
		eventName = normalizeEventName(payload.event);
		if (eventName !== "reaction" && eventName !== "liked" && eventName !== "like") {
			return false;
		}
		if (wasSeenRecently(payload)) {
			return false;
		}
		// ITPD: pass the reaction to the battle counter (added 2026-10-23)
		if (window.ITPDBattle) {
			try { window.ITPDBattle.onReaction(payload, eventName); } catch (itpdErr) {}
		}
		if (window.ITPDBattle && window.ITPDBattle.noFloat) {
			return true;
		}

		if (eventName === "liked" || eventName === "like") {
			spawnLikeBurst(payload);
			return true;
		}

		spawnSingleReaction(payload);
		return true;
	}

	function clearStage() {
		while (stage.firstChild) {
			stage.removeChild(stage.firstChild);
		}
		recentMessages.length = 0;
		spawnHistory.length = 0;
	}

	function setupBridge() {
		var iframe;

		if (!sessionId || useServerOnlyTransport()) {
			return;
		}

		iframe = document.createElement("iframe");
		iframe.src = "https://vdo.socialstream.ninja/?ln&salt=vdo.ninja&password=" + encodeURIComponent(password) + "&solo&view=" + encodeURIComponent(sessionId) + "&novideo&noaudio&label=" + encodeURIComponent(label) + "&cleanoutput&room=" + encodeURIComponent(sessionId);
		iframe.style.cssText = "width:0;height:0;border:0;position:absolute;left:-200px;top:-200px;";
		document.body.appendChild(iframe);

		window.addEventListener("message", function (event) {
			if (event.source !== iframe.contentWindow) {
				return;
			}
			if (event.data && event.data.dataReceived && event.data.dataReceived.overlayNinja) {
				processPayload(event.data.dataReceived.overlayNinja);
			}
		});
	}

	function setupSocket(serverURL) {
		var socket = null;
		var attempts = 1;

		function connect() {
			if (socket) {
				socket.onclose = null;
				socket.close();
			}

			socket = new WebSocket(serverURL);
			socket.onopen = function () {
				attempts = 1;
				socket.send(JSON.stringify({ join: sessionId, out: outChannel, in: inChannel }));
			};
			socket.onerror = function () {
				socket.close();
			};
			socket.onclose = function () {
				setTimeout(connect, Math.min(5000, 100 * attempts));
				attempts += 1;
			};
			socket.addEventListener("message", function (event) {
				var data;
				if (!event.data) {
					return;
				}
				try {
					data = JSON.parse(event.data);
					processPayload(data);
					if (data.get) {
						socket.send(JSON.stringify({ callback: { get: data.get, result: true } }));
					}
				} catch (e) {}
			});
		}

		connect();
	}

	function resolveSocketURL() {
		var hasServer = urlParams.has("server");
		var hasServer2 = urlParams.has("server2");
		var hasServer3 = urlParams.has("server3");
		var hasLocalServer = urlParams.has("localserver");

		if (hasServer) {
			return urlParams.get("server") || (hasLocalServer ? SocialStreamLocalServer.getWebSocketUrl() : "wss://io.socialstream.ninja/api");
		}
		if (hasServer2 || hasServer3) {
			return urlParams.get("server2") || urlParams.get("server3") || (hasLocalServer ? SocialStreamLocalServer.getWebSocketUrl() : "wss://io.socialstream.ninja/extension");
		}
		if (hasLocalServer) {
			return SocialStreamLocalServer.getWebSocketUrl();
		}
		return "";
	}

	window.__reactionsOverlay = {
		processPayload: processPayload,
		clearStage: clearStage,
		getConfig: function () {
			return {
				sessionId: sessionId,
				label: label,
				outChannel: outChannel,
				inChannel: inChannel,
				scale: scaleSetting,
				speed: speedSetting,
				burst: burstSetting,
				limit: limitSetting,
				pageBackground: pageBackground || "",
				align: alignSetting || "full",
				layout: layoutSetting,
				centerOrigin: centerOriginSetting,
				triple: tripleSetting
			};
		},
		getHistory: function () {
			return spawnHistory.slice();
		},
		getStageCount: function () {
			return stage.children.length;
		}
	};

	setupBridge();

	var socketURL = resolveSocketURL();
	if (sessionId && socketURL) {
		setupSocket(socketURL);
	}
})();
	</script>
	<!-- ===== ITPD reaction battle scoreboard (added 2026-10-23) ===== -->
	<style>
	#itpd-battle{position:fixed;left:50%;top:40px;transform:translateX(-50%) scale(var(--itpd-scale,1));transform-origin:top center;z-index:10;
	  width:820px;background:rgba(20,16,40,.82);border-radius:22px;padding:18px 24px 20px;box-shadow:0 8px 30px rgba(0,0,0,.35);
	  color:#fff;font-family:"Segoe UI",Roboto,Arial,sans-serif;opacity:0;transition:opacity .6s;pointer-events:none}
	body.itpd-bottom #itpd-battle{top:auto;bottom:40px;transform-origin:bottom center}
	#itpd-battle.on{opacity:1}
	#itpd-title{text-align:center;font-weight:800;font-size:30px;letter-spacing:.02em;margin-bottom:12px}
	#itpd-battle .sides{display:flex;align-items:center;justify-content:space-between;font-weight:800}
	#itpd-battle .side{display:flex;align-items:center;gap:12px;font-size:44px;font-variant-numeric:tabular-nums}
	#itpd-battle .emo{font-size:58px;line-height:1;transition:transform .2s}
	#itpd-battle .emo.pop{transform:scale(1.35)}
	#itpd-battle .side.lead .num{text-shadow:0 0 14px rgba(255,255,255,.6)}
	#itpd-bar{position:relative;height:30px;border-radius:15px;overflow:hidden;background:#ff3b6b;margin-top:12px}
	#itpd-barA{position:absolute;left:0;top:0;bottom:0;width:50%;background:#ff8a1f;transition:width .5s ease}
	#itpd-pct{display:flex;justify-content:space-between;font-weight:700;font-size:22px;margin-top:6px;opacity:.9}
	</style>
	<div id="itpd-battle" aria-hidden="true">
	  <div id="itpd-title">Party poppers vs Hearts</div>
	  <div class="sides">
	    <div class="side" id="itpd-sideA"><span class="emo" id="itpd-emoA">&#x1f389;</span><span class="num" id="itpd-numA">0</span></div>
	    <div class="side" id="itpd-sideB"><span class="num" id="itpd-numB">0</span><span class="emo" id="itpd-emoB">&#x2764;&#xfe0f;</span></div>
	  </div>
	  <div id="itpd-bar"><div id="itpd-barA"></div></div>
	  <div id="itpd-pct"><span id="itpd-pctA">50%</span><span id="itpd-pctB">50%</span></div>
	</div>
	<script>
	(function(){
	  "use strict";
	  var VERSION = "2026-10-23e";
	  var H = new URLSearchParams(location.hash.slice(1));
	  var URL_ = (H.get("url") || "").replace(/\/+$/,""), TOK = H.get("tok") || "";
	  var STATE_KEY = "itpd_reactbattle_state_2026", COUNT_KEY = "itpd_reactbattle_counts_2026";
	  var PRESETS = {
	    party:   { emoji:"\ud83c\udf89", name:"Party poppers", match:["\ud83c\udf89","1f389","party","popper","celebrat"] },
	    heart:   { emoji:"\u2764\ufe0f", name:"Hearts",        match:["\u2764","2764","heart","love"] },
	    laugh:   { emoji:"\ud83d\ude02", name:"Laughs",        match:["\ud83d\ude02","1f602","laugh","joy","lol"] },
	    wow:     { emoji:"\ud83d\ude2e", name:"Wows",          match:["\ud83d\ude2e","1f62e","wow","surpris","shock"] },
	    hundred: { emoji:"\ud83d\udcaf", name:"100s",          match:["\ud83d\udcaf","1f4af","hundred"] }
	  };
	  function $(id){ return document.getElementById(id); }
	  if (H.get("pos") === "bottom") document.body.classList.add("itpd-bottom");
	  var sc = parseFloat(H.get("scale")); if (sc > 0) document.documentElement.style.setProperty("--itpd-scale", sc);
	  var api = window.ITPDBattle = { noFloat: H.has("nofloat"), onReaction: function(){} };
	  if (!URL_ || !TOK) return;            // no Upstash settings: floating reactions only

	  function pipe(cmd){
	    return fetch(URL_ + "/pipeline", { method:"POST", headers:{ Authorization:"Bearer " + TOK, "Content-Type":"application/json" }, body:JSON.stringify(cmd), cache:"no-store" })
	      .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
	      .then(function(res){ return res.map(function(x){ return x.result; }); });
	  }
	  function getJSON(k){ return pipe([["GET", k]]).then(function(r){ try { return r[0] ? JSON.parse(r[0]) : null; } catch(e){ return null; } }); }
	  function setJSON(k, v){ return pipe([["SET", k, JSON.stringify(v)], ["EXPIRE", k, "604800"]]); }

	  var state = { on:false, seq:-1 }, counts = { seq:-1, a:0, b:0, other:0, recent:[] };
	  var dirty = false, lastWrite = 0, diag = { received:0, lastData:0 };

	  function haystack(p){
	    var parts = [String(p.chatmessage || ""), String(p.contentimg || "")];
	    try {
	      var d = new DOMParser().parseFromString("<div>" + String(p.chatmessage || "") + "</div>", "text/html");
	      parts.push(d.body.textContent || "");
	      d.querySelectorAll("img").forEach(function(i){ parts.push(i.getAttribute("alt") || "", i.getAttribute("src") || "", i.getAttribute("title") || ""); });
	    } catch(e){}
	    return parts.join(" ").toLowerCase();
	  }
	  function sideOf(p){
	    var h = haystack(p);
	    var hitA = PRESETS[state.a] && PRESETS[state.a].match.some(function(m){ return h.indexOf(m.toLowerCase()) !== -1; });
	    var hitB = PRESETS[state.b] && PRESETS[state.b].match.some(function(m){ return h.indexOf(m.toLowerCase()) !== -1; });
	    return hitA && !hitB ? "a" : hitB && !hitA ? "b" : "";
	  }
	  function paint(){
	    var A = PRESETS[state.a] || PRESETS.party, B = PRESETS[state.b] || PRESETS.heart;
	    $("itpd-battle").classList.toggle("on", !!state.on);
	    $("itpd-title").textContent = state.title || (A.name + " vs " + B.name);
	    $("itpd-emoA").textContent = A.emoji; $("itpd-emoB").textContent = B.emoji;
	    $("itpd-numA").textContent = counts.a; $("itpd-numB").textContent = counts.b;
	    var tot = counts.a + counts.b, pa = tot ? Math.round(counts.a * 100 / tot) : 50;
	    $("itpd-barA").style.width = pa + "%"; $("itpd-pctA").textContent = pa + "%"; $("itpd-pctB").textContent = (100 - pa) + "%";
	    $("itpd-sideA").classList.toggle("lead", counts.a > counts.b); $("itpd-sideB").classList.toggle("lead", counts.b > counts.a);
	  }
	  function pop(id){ var e = $(id); e.classList.add("pop"); setTimeout(function(){ e.classList.remove("pop"); }, 200); }

	  api.onReaction = function(p, eventName){
	    var plat = String(p.type || "").toLowerCase();
	    diag.received++; diag.lastData = Date.now();
	    var counted = plat.indexOf("tiktok") !== 0;          // a YouTube battle: TikTok likes don't count
	    var side = state.on && counted ? sideOf(p) : "";
	    if (side === "a"){ counts.a++; pop("itpd-emoA"); } else if (side === "b"){ counts.b++; pop("itpd-emoB"); } else counts.other++;
	    var sample = (String(p.chatmessage || "") || String(p.contentimg || "")).replace(/\s+/g, " ").slice(0, 160);
	    counts.recent.push({ t:Date.now(), side: !counted ? "ignored (" + plat + ")" : state.on ? (side || "none") : "off",
	                         sample:"(" + eventName + ") " + sample + " [" + (p.type || "?") + "]" });
	    if (counts.recent.length > 12) counts.recent.shift();
	    dirty = true; paint();
	  };

	  function pullState(){
	    getJSON(STATE_KEY).then(function(st){
	      if (!st) return;
	      var newBattle = st.seq !== state.seq;
	      state = st;
	      if (newBattle){
	        if (counts.seq === -1){
	          return getJSON(COUNT_KEY).then(function(c){
	            counts = (c && c.seq === st.seq) ? { seq:st.seq, a:c.a||0, b:c.b||0, other:c.other||0, recent:c.recent||[] } : { seq:st.seq, a:0, b:0, other:0, recent:[] };
	            paint();
	          });
	        }
	        counts = { seq:st.seq, a:0, b:0, other:0, recent:counts.recent }; dirty = true;
	      }
	      paint();
	    }).catch(function(){});
	  }
	  function pushCounts(){
	    var now = Date.now();
	    if (!dirty && now - lastWrite < 30000) return;
	    var snap = { seq:counts.seq, a:counts.a, b:counts.b, other:counts.other, recent:counts.recent, at:now, ver:VERSION,
	                 diag:{ bridgeAny:1, bridgeData:diag.received, feedData:0, lastData:diag.lastData, bridgeKinds:["SSN reactions overlay (copy)"], feedKinds:[] },
	                 where:(navigator.userAgent.match(/Chrome\/[\d]+/) || ["a browser"])[0] + " (" + (innerWidth + "x" + innerHeight) + ")" };
	    setJSON(COUNT_KEY, snap).then(function(){ dirty = false; lastWrite = now; }).catch(function(){});
	  }
	  pullState(); setInterval(pullState, 5000); setInterval(pushCounts, 10000);
	})();
	</script>
