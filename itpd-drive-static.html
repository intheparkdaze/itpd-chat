<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>ITPD Gift Drive (static)</title>
<!--
  ITPD Holiday Gift Drive, SIMPLE STATIC DISPLAY (Stream Engineering, 2026-11-12).
  Michael types two numbers on the phone (⚡ → 🎁 Gift Drive numbers); this shows them in Broadcast
  UI/UX's right-edge drive meter: the candy-stripe tube fills toward the next milestone ($250, $500,
  $1,000, $1,500, $2,000, then every $500) and Super Chats show in green. Nothing automatic.

  IRLToolkit browser source, 1920x1080:
    itpd-drive-static.html#url=https://charming-worm-109173.upstash.io&tok=READ_ONLY_TOKEN
    options: &test (sample numbers)
  Reads Upstash key itpd_drive_static_2026 = { show, gifts, sc, at } every 10 seconds; shows only
  while "On stream" is ON; hides if it can't read for 5 minutes. Look and ids are UI/UX's meter
  (drive-meter, dm-fill, dm-gifts, dm-next, dm-sc).
-->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--paper:#FFFBF3;--ink:#17152A;--navy:#22306B;--muted:#6B6780;--gold:#FFD34E;--red:#B3202D;--green:#1F7A4D;--amber:#B07A00}
  html,body{margin:0;background:transparent;overflow:hidden;font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;color:var(--ink)}
     the chat card / clock (bottom-right). Red thermometer = Given for gifts only. Super Chats
     are a separate green figure with no bar, so the two are never joined or compared. */
  #drive-meter{position:fixed;right:1.25vw;top:35vh;width:11.6vw;background:var(--paper);border-radius:.9vw;overflow:hidden;font-size:1.15vw;
    box-shadow:0 0 0 .16vw var(--red),0 .6vw 1.6vw rgba(0,0,0,.42);opacity:0;transform:translateX(130%);transition:opacity .6s,transform .7s cubic-bezier(.2,.9,.3,1.1)}
  #drive-meter.on{opacity:1;transform:none}
  #drive-meter .mh{display:flex;align-items:center;gap:.4em;background:var(--red);color:#fff;font:500 .62em/1 "DM Mono",monospace;letter-spacing:.18em;padding:.55em .7em}
  #drive-meter .mh svg{width:1.4em;height:1.4em}
  #drive-meter .gift{display:flex;gap:.7em;padding:.7em .75em .55em}
  #drive-meter .tube{position:relative;width:1.15em;height:9.5em;flex-shrink:0;border-radius:.6em;background:#EDE5D6;box-shadow:inset 0 0 0 .1em rgba(23,21,42,.08);overflow:hidden}
  #drive-meter .tube i{position:absolute;left:0;right:0;bottom:0;height:0;border-radius:.6em;transition:height 1.6s cubic-bezier(.2,.8,.2,1);
    background:repeating-linear-gradient(135deg,#B3202D 0 .45em,#FFFBF3 .45em .7em)}
  #drive-meter .gl{display:flex;flex-direction:column;justify-content:space-between;min-width:0}
  #drive-meter .lab{font:500 .6em/1.25 "DM Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  #drive-meter .amt{font-weight:800;font-size:1.65em;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
  #drive-meter .nx{font:500 .58em/1.3 "DM Mono",monospace;color:var(--red)}
  #drive-meter .scb{border-top:.16em dashed #E2D9C6;padding:.55em .75em .7em;background:#EEF6F0}
  #drive-meter .scb .amt{color:#1F7A4D;font-size:1.35em}
</style>
</head><body>
<div id="drive-meter" aria-hidden="true">
  <div class="mh"><svg viewBox="0 0 24 24"><rect x="3" y="10" width="18" height="11" rx="2" fill="#FFFBF3"/><rect x="2" y="7" width="20" height="4" rx="1.5" fill="#FFD34E"/><rect x="11" y="7" width="2" height="14" fill="#FFD34E"/></svg>GIFT DRIVE</div>
  <div class="gift"><div class="tube"><i id="dm-fill"></i></div>
    <div class="gl"><div><div class="lab">Given for gifts</div><div class="amt" id="dm-gifts">$0</div></div><div class="nx" id="dm-next"></div></div></div>
  <div class="scb"><div class="lab">Super Chats during the drive</div><div class="amt" id="dm-sc">$0</div></div>
</div>

<script>
(function(){
  "use strict";
  var H = new URLSearchParams(location.hash.slice(1));
  var URL_ = (H.get("url") || "").replace(/\/+$/, ""), TOK = H.get("tok") || "", KEY = "itpd_drive_static_2026";
  var $ = function(id){ return document.getElementById(id); }, lastOk = 0;
  var LADDER = [250, 500, 1000, 1500, 2000];
  function nextFor(v){
    for (var i = 0; i < LADDER.length; i++) if (v < LADDER[i]) return { prev: i ? LADDER[i - 1] : 0, next: LADDER[i] };
    var n = LADDER[LADDER.length - 1]; while (n <= v) n += 500; return { prev: n - 500, next: n };
  }
  function money(n){ return "$" + Math.floor(Math.max(0, Number(n) || 0)).toLocaleString("en-US"); }
  function paint(d){
    var v = Math.max(0, Number(d.gifts) || 0), r = nextFor(v);
    $("dm-gifts").textContent = money(v);
    $("dm-next").textContent = "Next milestone " + money(r.next);
    $("dm-fill").style.height = Math.max(4, Math.min(100, ((v - r.prev) / (r.next - r.prev)) * 100)) + "%";
    $("dm-sc").textContent = money(d.sc);
    $("drive-meter").classList.toggle("on", !!d.show);
  }
  function poll(){
    if (H.has("test")) { paint({ show:true, gifts:1234, sc:256 }); return; }
    if (!URL_ || !TOK) return;
    fetch(URL_ + "/get/" + KEY, { cache:"no-store", headers:{ Authorization:"Bearer " + TOK } })
      .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function(j){ var d = j && j.result ? JSON.parse(j.result) : { show:false }; lastOk = Date.now(); paint(d); })
      .catch(function(){ if (Date.now() - lastOk > 300000) $("drive-meter").classList.remove("on"); });
  }
  poll(); setInterval(poll, 10000);
})();
</script>
</body></html>
