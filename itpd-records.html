<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>ITPD records: likes</title>
<!--
  ITPD RECORDS: MOST LIKES IN A STREAM (2026-10-24)
  IRLToolkit browser source, 1920x1080, transparent. Shows a small like counter
  with the all-time record, and a celebration when this stream beats it.

  Likes come from YouTube's official Data API (videos.list, 1 unit a minute).
  The stream is found with search.list (its own 100-a-day allowance; two searches,
  live then scheduled, at most once every 10 minutes until found). A scheduled
  stream starting within 12 hours counts from its waiting page, before going live.
  Records live in Upstash.

  LINK (settings after the #, never in this file):
    itpd-records.html#url=https://charming-worm-109173.upstash.io&tok=READ_WRITE_TOKEN&key=YOUTUBE_API_KEY&chan=@InTheParkDaze&seed=257&seeddate=2026-09-20
  seed / seeddate: the starting record. Used only if no record is stored yet.
  Optional: &video=VIDEO_ID (skip the search), &pos=topleft|topright|bottomleft|bottomright
  (counter position, default topright; also left / right = middle of that edge), &nochip (celebration only), &scale=1.2,
  The counter's colour follows the park picked in the park overlay (checked every 30 s);
  &color=4A63A3 pins one colour instead.
  &test (fake likes climbing past the goal and the record; writes nothing).
  LIKE GOALS + STREAKS (2026-10-24): goals step up by themselves every &goal=50
  likes (50, 100, 150, ...). Each one is celebrated the first time a stream reaches
  it, and each has its own streak: streams in a row that reached 50, 100, 150...
  A stream that ends below a goal resets that goal's streak. If several goals are
  passed between two checks, only the highest is celebrated (all streaks still count).
  &streak=3 sets the streak for the first goal (50+) going into the current stream.
  It's applied once; to correct it later, change the number (e.g. &streak=4).
  A stream the overlay didn't run on can't be counted either way.
  Upstash key: itpd_records_goal_2026.
  PEAK VIEWERS RECORD (2026-10-25): YouTube's official "watching now" count, from the
  same once-a-minute request as the likes (no extra quota). A new high must hold for
  two checks in a row before it counts, so a one-off spike can't trigger it; then
  "MOST VIEWERS EVER!" plays once per stream and the record keeps rising with the
  held level. YouTube only. &vseed=252&vseeddate=YYYY-MM-DD sets the starting record,
  applied once per value (change the number to correct it). Because the check is once
  a minute, the overlay's peak can read a little lower than Studio's.
  SUBSCRIBER MILESTONES (2026-10-25): checks the channel's public subscriber count
  every 5 minutes (channels.list, 1 unit) and celebrates each &substep=100 milestone
  (default 100), with a bigger one every &subbig=1000. The first check ever only
  notes where you are (no celebration). A milestone crossed while the overlay wasn't
  running plays at the start of the next stream ("While we were away..."). YouTube
  rounds public counts above 1,000, so milestones should stay round numbers.
  &nosubs turns this part off without touching likes or viewers.
  SUBSCRIBER GOAL BAR (2026-11-04): &subgoal=2000 shows a progress bar toward that
  subscriber goal ("1,950 / 2,000 subscribers · 50 to go!"), checked every 2 minutes.
  When the goal is reached it moves on to the next thousand by itself. YouTube rounds
  public counts above 1,000 to three significant figures, so the bar moves in steps of
  10, unless the exact count from YouTube Studio is available (itpd-studio-subs.user.js
  on the home PC, read every 30 s). &subpos=topleft|topright|bottomleft|bottomright|top|bottom places it on its own.
  Default (Broadcast UI/UX, 2026-11-04): docked under the like counter in the top-right
  ("stack"), same width, shown as a slim one-line bar. "RACE TO 2K!" moment: when the
  Upstash key itpd_subs_hype_2026 changes (phone chat button, Stream Engineering), a big
  centre card plays for 9 s, then the full sub ticket shows under the likes for
  &subhold=25 seconds, then shrinks back to the slim bar. &hype plays it once on load (testing).
  The counter sizes itself to its text again (330 to 520 px) and its lines wrap instead
  of cutting off.

  Run ONE copy. Upstash keys: itpd_records_2026 (all-time records),
  itpd_records_live_2026 (this stream: video, likes, celebrated).
-->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* ITPD ticket look (Broadcast UI/UX, 2026-10-24). Element IDs and classes are the
     ones the script uses; only the styling and the static text changed. */
  :root{--park:#22306B;--navy:#22306B;--paper:#FFFBF3;--ink:#17152A;--muted:#6B6780;--gold:#FFD34E;--goldDeep:#B07A00;--pink:#D82A83;--red:#E0322B}
  html,body{margin:0;background:transparent;font-family:"Baloo 2","Trebuchet MS",sans-serif;color:var(--ink);overflow:hidden}

  /* ---------- the counter chip ---------- */
  #chip{position:fixed;top:16px;right:16px;transform:scale(var(--scale,1));transform-origin:top right;display:flex;width:max-content;min-width:330px;max-width:520px;
    background:var(--paper);border-radius:14px;box-shadow:0 10px 28px rgba(0,0,0,.38);overflow:hidden;opacity:0;transition:opacity .6s,box-shadow .6s}
  body.topleft #chip{right:auto;left:16px;transform-origin:top left}
  body.bottomright #chip{top:auto;bottom:140px;transform-origin:bottom right}
  body.bottomleft #chip{top:auto;bottom:140px;right:auto;left:16px;transform-origin:bottom left}
  body.right #chip{top:50%;transform:translateY(-50%) scale(var(--scale,1));transform-origin:right center}
  body.left #chip{top:50%;transform:translateY(-50%) scale(var(--scale,1));right:auto;left:16px;transform-origin:left center}
  #chip.on{opacity:1}
  #chip .stub{width:40px;flex-shrink:0;background:var(--park);border-right:3px dashed rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;transition:background .6s}
  #chip .stub span{writing-mode:vertical-rl;transform:rotate(180deg);font:500 11px/1 "DM Mono",monospace;letter-spacing:2px;color:#fff;white-space:nowrap}
  #chip .stub .b{display:none}
  #chip .body{flex:1;min-width:0;padding:8px 14px 10px 13px}
  #chip .k{font-weight:700;font-size:14px;letter-spacing:1px;color:var(--park);line-height:1}
  #chip .row1{display:flex;align-items:baseline;gap:10px;margin-top:4px}
  #chip .now{font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
  #chip .lbl{font-weight:700;font-size:18px;color:var(--muted)}
  #chip .rec{font:500 14px/1.3 "DM Mono",monospace;color:var(--muted);margin-top:3px}
  #chip .bar{height:9px;border-radius:5px;background:#EDE5D6;overflow:hidden;margin-top:6px}
  #chip .fill{height:100%;width:0;background:var(--park);border-radius:6px;transition:width .8s ease}
  /* record beaten: gold stub that reads NEW RECORD, gold ring, gold bar */
  #chip.beaten{box-shadow:0 0 0 3px var(--gold),0 10px 28px rgba(0,0,0,.38)}
  #chip.beaten .stub{background:var(--goldDeep)}
  #chip.beaten .stub .a{display:none} #chip.beaten .stub .b{display:inline}
  #chip.beaten .k{color:var(--goldDeep)}
  #chip.beaten .fill{background:linear-gradient(90deg,var(--gold),#F7931E)}

  /* like goal streak line (Stream Engineering, 2026-10-24; restyle freely, keep id="streak" and class "hit") */
  #chip .streak{font-weight:700;font-size:17px;line-height:1.25;color:var(--park);margin-top:6px}
  #chip .streak:empty{display:none}
  #chip .streak.hit{color:var(--goldDeep)}
  /* viewers line (Stream Engineering, 2026-10-25; restyle freely, keep id="viewers" and class "hit") */
  #chip .viewers{font-weight:700;font-size:16px;line-height:1.25;margin-top:4px;color:var(--navy);opacity:.9}
  #chip .viewers:empty{display:none}
  #chip .viewers.hit{color:var(--goldDeep)}
  /* subscriber goal bar: ITPD ticket (Broadcast UI/UX, 2026-11-04; built on Stream
     Engineering's bar; keep the ids subbar, sbNow, sbGoal, sbGoal2, sbFill, sbGo).
     Default: docked right under the like counter (top-right), the two read as one
     "goals" stack and nothing sits on the bottom-left park ticket. &subpos= still
     places it on its own. */
  #subbar{position:fixed;left:16px;bottom:140px;width:420px;display:flex;background:var(--paper);border-radius:14px;overflow:hidden;
    box-shadow:0 10px 28px rgba(0,0,0,.38);opacity:0;transition:opacity .6s,box-shadow .6s;transform:scale(var(--scale,1));transform-origin:bottom left}
  #subbar.on{opacity:1}
  body.sub-topleft #subbar{bottom:auto;top:16px;transform-origin:top left}
  body.sub-topright #subbar{bottom:auto;top:16px;left:auto;right:16px;transform-origin:top right}
  body.sub-bottomright #subbar{left:auto;right:16px;transform-origin:bottom right}
  body.sub-top #subbar{bottom:auto;top:16px;left:50%;margin-left:-210px;transform-origin:top center}
  body.sub-bottom #subbar{left:50%;margin-left:-210px;transform-origin:bottom center}
  body.sub-stack #subbar{bottom:auto;left:auto;right:16px;top:16px;transform:none;min-width:330px;transition:opacity .6s,top .4s,box-shadow .6s}
  #subbar .sstub{width:40px;flex-shrink:0;background:var(--red);border-right:3px dashed rgba(255,255,255,.45);display:flex;align-items:center;justify-content:center}
  #subbar .sstub span{writing-mode:vertical-rl;transform:rotate(180deg);font:500 11px/1 "DM Mono",monospace;letter-spacing:2px;color:#fff;white-space:nowrap}
  #subbar .sbody{flex:1;min-width:0;padding:8px 14px 10px 13px}
  #subbar .k{font-weight:700;font-size:14px;letter-spacing:1px;color:var(--red);line-height:1}
  #subbar .t{font-weight:800;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--ink);margin-top:4px;white-space:nowrap}
  #subbar .t small{font-weight:700;font-size:16px;color:var(--muted);margin-left:4px}
  #subbar .bar{position:relative;height:14px;border-radius:7px;background:#EDE5D6;overflow:hidden;margin-top:7px}
  #subbar .fill{position:relative;height:100%;width:0;border-radius:7px;transition:width 1.2s ease;
    background:repeating-linear-gradient(135deg,var(--red) 0 10px,#C81E2A 10px 20px)}   /* candy-stripe, still: no motion */
  #subbar .fill::after{content:"";position:absolute;right:2px;top:2px;width:10px;height:10px;border-radius:50%;background:#FFFBF3;box-shadow:0 0 6px rgba(255,255,255,.8)}
  #subbar .go{font-weight:700;font-size:16px;line-height:1.25;color:var(--navy);margin-top:6px}
  #subbar.done{box-shadow:0 0 0 3px var(--gold),0 10px 28px rgba(0,0,0,.38)}
  #subbar.done .sstub{background:var(--goldDeep)} #subbar.done .k{color:var(--goldDeep)}
  #subbar.done .fill{background:linear-gradient(90deg,var(--gold),#F7931E)} #subbar.done .go{color:var(--goldDeep)}

  /* compact sub bar (stack mode): one slim line under the like counter */
  #subbar .sstub, #subbar .sbody, #subbar .k, #subbar .t, #subbar .t small, #subbar .bar, #subbar .go{transition:all .7s cubic-bezier(.4,0,.2,1)}
  #subbar.mini .sstub{width:12px} #subbar.mini .sstub span{opacity:0;font-size:0;letter-spacing:0}
  #subbar.mini .sbody{padding:6px 12px 7px 10px;display:flex;align-items:center;gap:10px}
  #subbar.mini .k{font-size:0;letter-spacing:0;opacity:0;width:0}
  #subbar.mini .t{font-size:17px;margin-top:0;flex-shrink:0}
  #subbar.mini .t small{font-size:0;margin:0}
  #subbar.mini .t::after{content:" subs";font-size:13px;font-weight:700;color:var(--muted)}
  #subbar.mini .bar{flex:1;height:8px;margin-top:0}
  #subbar.mini .fill::after{width:6px;height:6px;top:1px}
  #subbar.mini .go{font-size:0;margin:0;opacity:0;max-height:0}
  #subbar.hidden{opacity:0 !important}

  /* "RACE TO 2K!" moment, triggered from the phone (Broadcast UI/UX, 2026-11-04) */
  #hype{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%) scale(.7);opacity:0;pointer-events:none;display:flex;z-index:6;
    background:var(--paper);border-radius:34px;box-shadow:0 0 0 7px var(--red),0 26px 70px rgba(0,0,0,.55);
    transition:opacity .55s, transform .65s cubic-bezier(.2,1.35,.4,1)}
  #hype.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #hype.leave{opacity:0;transform:translate(-50%,-60%) scale(.92);transition:opacity .6s, transform .6s ease-in}
  #hype .flag{width:110px;flex-shrink:0;border-radius:34px 0 0 34px;border-right:6px dashed rgba(255,255,255,.6);
    background:conic-gradient(#17152A 25%, #FFFBF3 0 50%, #17152A 0 75%, #FFFBF3 0) 0 0/36px 36px}   /* checkered flag */
  #hype .hb{padding:40px 70px 44px 56px;min-width:900px}
  #hype .hk{font-weight:800;font-size:34px;letter-spacing:4px;color:var(--red)}
  #hype .ht{font-weight:800;font-size:150px;line-height:.92;color:var(--ink);margin-top:6px;letter-spacing:-2px}
  #hype .ht b{color:var(--red)}
  #hype .hnum{font-weight:800;font-size:58px;color:var(--navy);margin-top:18px;font-variant-numeric:tabular-nums}
  #hype .hnum small{font-size:30px;color:var(--muted);margin-left:8px}
  #hype .hbar{position:relative;height:30px;border-radius:15px;background:#EDE5D6;overflow:hidden;margin-top:12px}
  #hype .hfill{height:100%;width:0;border-radius:15px;background:repeating-linear-gradient(135deg,var(--red) 0 16px,#C81E2A 16px 32px);transition:width 1.6s cubic-bezier(.2,.8,.2,1) .5s}
  #hype .hgo{font-weight:700;font-size:36px;color:var(--navy);margin-top:16px}
  #hype .hstamp{position:absolute;right:-44px;top:-60px;width:200px;height:200px;border-radius:50%;border:9px double var(--red);color:var(--red);background:rgba(255,251,243,.95);
    display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:70px;line-height:.9;
    transform:rotate(12deg) scale(1.9);opacity:0;transition:transform .35s cubic-bezier(.3,1.6,.5,1) .7s,opacity .2s .7s}
  #hype .hstamp small{font-size:22px;letter-spacing:2px}
  #hype.show .hstamp{transform:rotate(12deg) scale(1);opacity:1}
  .hstar{position:fixed;left:50%;top:46%;width:30px;height:30px;pointer-events:none;z-index:5;opacity:0}
  .hstar.go{animation:hpop 1.6s ease-out forwards}
  @keyframes hpop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1) rotate(200deg)}}
  @media (prefers-reduced-motion:reduce){#hype,#hype.leave{transition:opacity .3s}.hstar{display:none}#subbar *{transition:none}}

  /* ---------- the celebration (once per stream) ---------- */
  #party{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;display:flex;
    background:var(--paper);border-radius:30px;box-shadow:0 0 0 6px var(--gold),0 22px 60px rgba(0,0,0,.5);overflow:visible;
    transition:opacity .5s, transform .55s cubic-bezier(.2,1.4,.4,1);z-index:5}
  #party.show{opacity:1;transform:translate(-50%,-50%) scale(var(--scale,1))}
  #party .stub{width:96px;flex-shrink:0;background:var(--goldDeep);border-radius:30px 0 0 30px;border-right:5px dashed rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center}
  #party .stub span{writing-mode:vertical-rl;transform:rotate(180deg);font:500 22px/1 "DM Mono",monospace;letter-spacing:5px;color:#fff;white-space:nowrap}
  #party .body{padding:34px 64px 38px 50px;text-align:left}
  #party .k{font-weight:800;font-size:34px;letter-spacing:3px;color:var(--red)}
  #party .row{display:flex;align-items:baseline;gap:18px;margin:6px 0 0}
  #party .big{font-weight:800;font-size:150px;line-height:.95;color:var(--ink);font-variant-numeric:tabular-nums}
  #party .unit{font-weight:800;font-size:56px;color:var(--navy)}
  #party .rule{width:150px;height:10px;border-radius:5px;background:var(--gold);margin:14px 0 14px}
  #party .sub{font-weight:700;font-size:34px;color:var(--navy);line-height:1.2}
  #party .old{font:500 22px/1.2 "DM Mono",monospace;color:var(--muted);margin-top:12px}
  #party .stamp{position:absolute;right:-36px;top:-50px;width:190px;height:190px;border-radius:50%;border:8px double var(--red);color:var(--red);
    display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:34px;line-height:.95;text-align:center;
    background:rgba(255,251,243,.94);transform:rotate(14deg) scale(1.8);opacity:0;transition:transform .35s cubic-bezier(.3,1.6,.5,1) .45s,opacity .2s .45s}
  #party.show .stamp{transform:rotate(14deg) scale(1);opacity:1}
  #party .stamp small{font-size:22px;letter-spacing:2px}
  /* falling confetti during the celebration only */
  .bit{position:fixed;top:-40px;font-size:40px;animation:fall linear forwards;pointer-events:none}
  @keyframes fall{to{transform:translateY(115vh) rotate(540deg);opacity:.9}}
  @media (prefers-reduced-motion:reduce){.bit{display:none}#party{transition:opacity .3s}#party .stamp{transition:none}}
</style>
</head>
<body>
<div id="chip">
  <div class="stub"><span class="a">LIKE RECORD</span><span class="b">NEW RECORD</span></div>
  <div class="body">
    <div class="k">LIKES THIS STREAM</div>
    <div class="row1"><span class="now" id="now">0</span><span class="lbl">&#x1F44D;</span></div>
    <div class="rec" id="rec">Record: &#x2013;</div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="streak" id="streak"></div>
    <div class="viewers" id="viewers"></div>
  </div>
</div>
<div id="subbar" aria-hidden="true">
  <div class="sstub"><span>SUB GOAL</span></div>
  <div class="sbody">
    <div class="k">ROAD TO <span id="sbGoal">2,000</span></div>
    <div class="t"><span id="sbNow">0</span> / <span id="sbGoal2">2,000</span><small>subscribers</small></div>
    <div class="bar"><div class="fill" id="sbFill"></div></div><div class="go" id="sbGo"></div>
  </div>
</div>
<div id="hype" aria-hidden="true">
  <div class="flag"></div>
  <div class="hb">
    <div class="hk">THE RACE IS ON</div>
    <div class="ht">Race to <b id="hGoalShort">2K</b>!</div>
    <div class="hnum"><span id="hNow">0</span> / <span id="hGoal">2,000</span><small>subscribers</small></div>
    <div class="hbar"><div class="hfill" id="hFill"></div></div>
    <div class="hgo" id="hGo"></div>
  </div>
  <div class="hstamp"><small>ONLY</small><span id="hLeft">0</span><small>TO GO</small></div>
</div>
<div id="party" aria-hidden="true">
  <div class="stub"><span id="pStub">ITPD RECORD</span></div>
  <div class="body">
    <div class="k" id="pK">NEW RECORD!</div>
    <div class="row"><span class="big" id="pBig">0</span><span class="unit" id="pUnit">likes</span></div>
    <div class="rule"></div>
    <div class="sub" id="pSub">The most ever in a stream! Thank you, Daze crew!</div>
    <div class="old" id="pOld"></div>
  </div>
  <div class="stamp" id="pStamp"><small>ALL-TIME</small>HIGH</div>
</div>
<script>
(function(){
  "use strict";
  var H = new URLSearchParams(location.hash.slice(1));
  var URL_ = (H.get("url") || "").replace(/\/+$/,""), TOK = H.get("tok") || "", KEY = H.get("key") || "";
  var CHAN = H.get("chan") || "", VIDEO = H.get("video") || "", TEST = H.has("test");
  var REC_KEY = "itpd_records_2026", LIVE_KEY = "itpd_records_live_2026", GOAL_KEY = "itpd_records_goal_2026";
  var GOAL = parseInt(H.get("goal"), 10) > 0 ? parseInt(H.get("goal"), 10) : 50;
  function $(id){ return document.getElementById(id); }
  var pos = H.get("pos"); if (pos && pos !== "topright") document.body.classList.add(pos);
  var sc = parseFloat(H.get("scale")); if (sc > 0) document.documentElement.style.setProperty("--scale", sc);
  var showChip = !H.has("nochip");

  // Park colours: same order and colours as the park overlay's venue list
  // (itpd-park-overlay-themed.html). The counter follows the venue picked there.
  var PARK_COLORS = ["#4A63A3","#1B9C9C","#E8622C","#2F6B3A","#6A2C91","#B3202D","#1B2A5C",
                     "#3F7C8A","#5A6C7D","#C8202F","#146356","#4B2E83","#B00020","#E0197C"];
  var PARK_KEY = "itpd_parkoverlay_state_2026";
  function followPark(){
    if (H.has("color")) return;                       // &color=... pins one colour
    getJSON(PARK_KEY).then(function(st){
      var c = st && typeof st.venue === "number" ? PARK_COLORS[st.venue] : "";
      document.documentElement.style.setProperty("--park", c || "#22306B");
    }).catch(function(){});
  }
  if (H.get("color")) document.documentElement.style.setProperty("--park", (/^[0-9a-f]{6}$/i.test(H.get("color")) ? "#" : "") + H.get("color"));

  function pipe(cmd){
    return fetch(URL_ + "/pipeline", { method:"POST", headers:{ Authorization:"Bearer " + TOK, "Content-Type":"application/json" }, body:JSON.stringify(cmd), cache:"no-store" })
      .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function(res){ return res.map(function(x){ return x.result; }); });
  }
  function getJSON(k){ return pipe([["GET", k]]).then(function(r){ try { return r[0] ? JSON.parse(r[0]) : null; } catch(e){ return null; } }); }
  function setJSON(k, v){ return TEST ? Promise.resolve() : pipe([["SET", k, JSON.stringify(v)]]); }
  function yt(path, params){
    params.key = KEY;
    return fetch("https://www.googleapis.com/youtube/v3/" + path + "?" + new URLSearchParams(params), { cache:"no-store" })
      .then(function(r){ return r.json(); }).then(function(j){ if (j.error) throw new Error(j.error.message || "API error"); return j; });
  }
  function fmtDate(d){ if (!d) return ""; var p = String(d).split("-"); return p.length === 3 ? (+p[1]) + "/" + (+p[2]) : d; }
  function today(){ var d = new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth()+1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }

  // record = { value, date, prev:{value,date} }; live = { videoId, likes, celebrated }
  var record = null, live = { videoId:"", likes:0, celebrated:"" }, lastSearch = 0, chanId = "";
  // goal = { step, streaks:{ "50":3, "100":1, ... }, lastVideo, best, shownUpTo }
  //   best = highest goal the last stream seen reached; shownUpTo = highest goal celebrated on screen
  var goal = null, status = "", queuedTier = 0, pendingSeed = null;
  // viewers record = { value, date, prev, seedApplied }; viewers = latest count; held = previous check's count
  var vrecord = null, viewers = null, held = null;
  function saveRecords(){ return setJSON(REC_KEY, { likes:record, viewers:vrecord, subs:subs }); }

  function paint(){
    if (!record) return;
    var beaten = !!live.videoId && live.celebrated === live.videoId && !!record.prev;
    $("now").textContent = live.likes;
    $("rec").textContent = beaten ? "\u{1F451} New record! (old: " + record.prev.value + " on " + fmtDate(record.prev.date) + ")"
                                  : "Record: " + record.value + " on " + fmtDate(record.date);
    var cur = goal && goal.lastVideo === live.videoId ? goal.best : 0;      // highest goal reached this stream
    var next = goal ? cur + goal.step : 0;
    if (!beaten && goal) $("rec").textContent = "Next goal " + next + " \u00b7 Record " + record.value + " on " + fmtDate(record.date);
    // the bar fills toward the next goal
    var aim = goal ? next : record.value;
    var pct = beaten ? 100 : Math.min(100, Math.round(live.likes * 100 / Math.max(1, aim)));
    if (goal){
      var left = Math.max(0, next - live.likes), sNext = streakOf(next), sCur = streakOf(cur);
      // e.g. "3 in a row at 50+ · 43 more to make it 4" or "4 in a row at 50+ · next: 48 more to hit 100"
      var shown = cur ? cur : (sNext > 0 ? next : 0), sShown = streakOf(shown);
      $("streak").textContent = (shown ? "\u{1F525} " + sShown + " in a row at " + shown + "+ \u00b7 " : "\u{1F3AF} ") +
        (cur === 0 && sNext > 0 ? left + " more to make it " + (sNext + 1)
         : sNext > 0 ? left + " more to make it " + (sNext + 1) + " at " + next + "+"
         : (cur ? "next: " : "") + left + " more to hit " + next);
      $("streak").classList.toggle("hit", cur > 0);
    }
    $("fill").style.width = pct + "%";
    $("chip").classList.toggle("beaten", beaten);
    $("chip").classList.toggle("on", showChip && !!live.videoId);
  }

  // Celebrations wait in line (goal, then record) and only play once the stream
  // is actually live, not on the waiting page before it starts.
  var partyQueue = [], partyBusy = false;
  function queueParty(c){ partyQueue.push(c); runParty(); }
  function runParty(){
    if (partyBusy || !partyQueue.length || (status !== "live" && !TEST)) return;
    partyBusy = true;
    var c = partyQueue.shift();
    showParty(c);
    if (c.goal && goal && c.goal > (goal.shownUpTo || 0)){ goal.shownUpTo = c.goal; setJSON(GOAL_KEY, goal).catch(function(){}); }
    setTimeout(function(){ partyBusy = false; runParty(); }, 10500);
  }
  function celebrate(likes, old){
    queueParty({ stub:"ITPD RECORD", k:"NEW RECORD!", big:likes, sub:"The most ever in a stream! Thank you, Daze crew!",
                 old:"Old record: " + old.value + " on " + fmtDate(old.date), stamp:["ALL-TIME", "HIGH"] });
  }
  function streakOf(t){ return t > 0 && goal && goal.streaks ? (goal.streaks[String(t)] || 0) : 0; }
  function celebrateGoal(likes, tier){
    var n = streakOf(tier);
    queueParty({ goal:tier, stub:"ITPD LIKE GOAL", k:tier + " LIKES!", big:likes,
                 sub: n > 1 ? "That's " + n + " streams in a row at " + tier + "+! Thank you, Daze crew!" : "We hit " + tier + " likes! Thank you, Daze crew!",
                 old: n > 1 ? "\u{1F525} " + n + "-stream streak at " + tier + "+" : "\u{1F525} A new " + tier + "+ streak starts today",
                 stamp:[String(n), n === 1 ? "STREAM" : "IN A ROW"] });
  }
  function showParty(c){
    $("pStub").textContent = c.stub; $("pK").textContent = c.k; $("pBig").textContent = c.big; $("pUnit").textContent = c.unit || "likes";
    $("pSub").textContent = c.sub; $("pOld").textContent = c.old;
    var st = $("pStamp"); st.textContent = ""; var sm = document.createElement("small"); sm.textContent = c.stamp[0]; st.appendChild(sm); st.appendChild(document.createTextNode(c.stamp[1]));
    $("party").classList.add("show");
    var emo = c.emo || ["\u{1F44D}","\u{1F389}","\u2B50","\u{1F49B}"];
    for (var i = 0; i < (c.bits || 40); i++){
      var b = document.createElement("div"); b.className = "bit"; b.textContent = emo[i % emo.length];
      b.style.left = Math.random() * 100 + "vw"; b.style.animationDuration = (2.5 + Math.random() * 2.5) + "s"; b.style.animationDelay = Math.random() * 1.5 + "s";
      document.body.appendChild(b); setTimeout(function(x){ return function(){ x.remove(); }; }(b), 7000);
    }
    setTimeout(function(){ $("party").classList.remove("show"); }, 9000);
  }

  // A new like count arrives: update, beat the record once per stream, keep raising it after.
  function onLikes(likes){
    if (!record || !(likes >= 0)) return;
    live.likes = likes;
    if (goal && goal.lastVideo === live.videoId){
      var reached = Math.floor(likes / goal.step) * goal.step;
      if (reached > goal.best){
        // every newly passed goal extends its own streak; celebrate only the highest
        for (var t = goal.best + goal.step; t <= reached; t += goal.step) goal.streaks[String(t)] = (goal.streaks[String(t)] || 0) + 1;
        goal.best = reached;
        setJSON(GOAL_KEY, goal).catch(function(){});
        queuedTier = reached; celebrateGoal(likes, reached);
      }
    }
    var first = live.celebrated !== live.videoId;
    if (likes > record.value){
      if (first){
        record = { value:likes, date:today(), videoId:live.videoId, prev:{ value:record.value, date:record.date } };
        live.celebrated = live.videoId;
        celebrate(likes, record.prev);
      } else {
        record.value = likes; record.date = today();
      }
      saveRecords().catch(function(){});
    }
    setJSON(LIVE_KEY, live).catch(function(){});
    paint();
  }

  // A new viewer count (live only). A new high counts once two checks in a row are above the record.
  function onViewers(n){
    if (!vrecord || !(n >= 0)) return;
    viewers = n;
    var level = held !== null ? Math.min(held, n) : -1;   // the level held across both checks
    held = n;
    if (level > vrecord.value){
      if (live.vcelebrated !== live.videoId){
        vrecord = { value:level, date:today(), prev:{ value:vrecord.value, date:vrecord.date }, seedApplied:vrecord.seedApplied };
        live.vcelebrated = live.videoId;
        queueParty({ stub:"ITPD RECORD", k:"MOST VIEWERS EVER!", big:level, unit:"watching",
                     sub:"The biggest Daze crew ever, all at once! Thank you!",
                     old:"Old record: " + vrecord.prev.value + (vrecord.prev.date ? " on " + fmtDate(vrecord.prev.date) : ""), stamp:["ALL-TIME", "HIGH"] });
      } else { vrecord.value = level; vrecord.date = today(); }
      saveRecords().catch(function(){});
      setJSON(LIVE_KEY, live).catch(function(){});
    }
    paintViewers();
  }
  function paintViewers(){
    var el = $("viewers");
    if (!vrecord || viewers === null || status !== "live"){ el.textContent = ""; return; }
    var beat = live.vcelebrated === live.videoId && !!live.videoId;
    el.textContent = "\u{1F440} " + viewers + " watching \u00b7 " + (beat ? "\u{1F451} new record " + vrecord.value : "Record " + vrecord.value + (vrecord.date ? " on " + fmtDate(vrecord.date) : ""));
    el.classList.toggle("hit", beat);
  }

  // ----- Subscriber milestones (kept separate: a problem here can't touch likes or viewers) -----
  var SUBSTEP = parseInt(H.get("substep"), 10) > 0 ? parseInt(H.get("substep"), 10) : 100;
  var SUBBIG = parseInt(H.get("subbig"), 10) > 0 ? parseInt(H.get("subbig"), 10) : 1000;
  var subs = null, subsFirstCheck = true;    // subs = { last (milestone already celebrated), count, at }
  function fmtN(n){ return Number(n).toLocaleString("en-US"); }
  var SUBGOAL = parseInt(H.get("subgoal"), 10) > 0 ? parseInt(H.get("subgoal"), 10) : 0;
  if (SUBGOAL){ var sp = H.get("subpos"); if (sp) document.body.classList.add("sub-" + sp); }
  function paintSubBar(count){
    if (!SUBGOAL || !(count >= 0)) return;
    var goal = SUBGOAL, just = false;
    while (count >= goal){ just = goal; goal = (Math.floor(goal / 1000) + 1) * 1000; }   // goal reached: next thousand
    var showGoal = just && count - just < 50 ? just : goal;                                // stay on the reached goal briefly
    var pct = Math.min(100, Math.round(count * 100 / showGoal));
    $("sbNow").textContent = fmtN(count);
    $("sbGoal").textContent = $("sbGoal2").textContent = fmtN(showGoal);
    $("sbFill").style.width = pct + "%";
    var left = showGoal - count;
    $("sbGo").textContent = left > 0 ? fmtN(left) + " to go! Hit subscribe and help us get there \ud83d\udc9b" : "We did it! Thank you, Daze crew! \ud83c\udf89";
    $("subbar").classList.toggle("done", left <= 0);
    $("subbar").classList.add("on");
  }
  function onSubs(count){
    if (!(count >= 0)) return;
    paintSubBar(count);
    var m = Math.floor(count / SUBSTEP) * SUBSTEP;
    if (!subs || !(subs.last >= 0)){
      subs = { last:m, count:count, at:Date.now() };          // first ever check: just note where we are
    } else {
      if (m > subs.last){
        var big = Math.floor(m / SUBBIG) > Math.floor(subs.last / SUBBIG);   // crossed a thousand on the way
        var shown = big ? Math.floor(m / SUBBIG) * SUBBIG : m;
        var away = subsFirstCheck;
        queueParty({ stub:"ITPD MILESTONE", k:fmtN(shown) + " SUBSCRIBERS!", big:fmtN(shown), unit:"subscribers",
                     sub: away ? "While we were away, we hit " + fmtN(shown) + "! Thank you, Daze crew!"
                               : big ? "What a moment! Thank you for being part of the Daze crew!" : "Thank you for being part of the Daze crew!",
                     old:"Next stop: " + fmtN(m + SUBSTEP), stamp: big ? ["BIG", "MILESTONE"] : ["NEW", "MILESTONE"],
                     bits: big ? 90 : 40, emo: ["\u{1F389}","\u{1F49B}","\u2B50","\u{1F38A}"] });
        subs.last = m;
      }
      subs.count = count; subs.at = Date.now();
    }
    subsFirstCheck = false;
    saveRecords().catch(function(){});
  }
  // 11/04: an exact count from YouTube Studio (itpd-studio-subs.user.js on the home PC
  // saves it to Upstash) is used while it's fresh; otherwise YouTube's rounded public count.
  var lastApiSubs = 0, publicSubs = null;
  // Sanity check (11/04): the Studio number is only trusted if it's close to YouTube's
  // public count (which is rounded to 3 significant figures), so a misread like "1"
  // can never reach the screen.
  function plausible(n){
    if (!(n >= 0)) return false;
    if (publicSubs == null) return false;
    return Math.abs(n - publicSubs) <= Math.max(25, publicSubs * 0.02);
  }
  function pollSubs(){
    if (H.has("nosubs")) return;
    if (publicSubs == null && Date.now() - lastApiSubs >= 120000){ lastApiSubs = Date.now(); pollSubsApi(); return; }
    getJSON("itpd_subs_live_2026").then(function(live){
      if (live && live.count >= 0 && Date.now() - live.at < 300000 && plausible(Number(live.count))){ onSubs(Number(live.count)); return; }
      if (Date.now() - lastApiSubs < 120000) return;           // public count: at most every 2 minutes
      lastApiSubs = Date.now(); pollSubsApi();
    }).catch(function(){ if (Date.now() - lastApiSubs >= 120000){ lastApiSubs = Date.now(); pollSubsApi(); } });
  }
  function pollSubsApi(){
    var getChan = /^UC[\w-]{20,}$/.test(CHAN) ? Promise.resolve(CHAN) : chanId ? Promise.resolve(chanId)
      : yt("channels", { part:"id", forHandle:CHAN.replace(/^@/, "") }).then(function(j){ chanId = j.items && j.items[0] && j.items[0].id || ""; return chanId; });
    getChan.then(function(ch){
      if (!ch) return;
      return yt("channels", { part:"statistics", id:ch, fields:"items(statistics(subscriberCount,hiddenSubscriberCount))" }).then(function(j){
        var st = j.items && j.items[0] && j.items[0].statistics;
        if (!st || st.hiddenSubscriberCount) return;
        publicSubs = Number(st.subscriberCount);
        onSubs(Number(st.subscriberCount));
      });
    }).catch(function(e){ console.warn("subs:", e.message); });
  }

  function findVideo(){
    if (VIDEO) return Promise.resolve(VIDEO);
    if (live.videoId) return Promise.resolve(live.videoId);
    if (Date.now() - lastSearch < 600000) return Promise.resolve("");
    lastSearch = Date.now();
    var getChan = /^UC[\w-]{20,}$/.test(CHAN) ? Promise.resolve(CHAN) : chanId ? Promise.resolve(chanId)
      : yt("channels", { part:"id", forHandle:CHAN.replace(/^@/, "") }).then(function(j){ chanId = j.items && j.items[0] && j.items[0].id || ""; return chanId; });
    // Live first; if nothing is live yet, the scheduled stream starting soonest
    // (within 12 hours), because likes on the waiting page count toward the stream.
    var ch;
    return getChan.then(function(c){
      ch = c; if (!ch) throw new Error("channel not found");
      return yt("search", { part:"id", channelId:ch, eventType:"live", type:"video", maxResults:"1" });
    }).then(function(j){
      var v = j.items && j.items[0] && j.items[0].id && j.items[0].id.videoId;
      if (v) return v;
      return yt("search", { part:"id", channelId:ch, eventType:"upcoming", type:"video", maxResults:"5" }).then(function(u){
        var ids = (u.items || []).map(function(x){ return x.id && x.id.videoId; }).filter(Boolean);
        if (!ids.length) return "";
        return yt("videos", { part:"liveStreamingDetails", id:ids.join(","), fields:"items(id,liveStreamingDetails(scheduledStartTime))" }).then(function(d){
          var best = "", bestT = Infinity, now = Date.now();
          (d.items || []).forEach(function(it){
            var t = Date.parse(it.liveStreamingDetails && it.liveStreamingDetails.scheduledStartTime);
            if (isFinite(t) && t - now < 12 * 3600000 && t > now - 6 * 3600000 && t < bestT){ best = it.id; bestT = t; }
          });
          return best;
        });
      });
    });
  }
  function poll(){
    findVideo().then(function(v){
      if (!v) return;
      return yt("videos", { part:"statistics,snippet,liveStreamingDetails", id:v, fields:"items(statistics(likeCount),snippet(liveBroadcastContent),liveStreamingDetails(concurrentViewers))" }).then(function(j){
        var it = j.items && j.items[0];
        if (!it){ if (!VIDEO) live.videoId = ""; paint(); return; }
        status = (it.snippet && it.snippet.liveBroadcastContent) || "";
        // "upcoming" = waiting page before going live: keep counting. "none" = stream over:
        // forget it (no counting, no streak changes) and look for the next one.
        if (status === "none" && !VIDEO){ live.videoId = ""; lastSearch = 0; paint(); setTimeout(poll, 1000); return; }
        if (v !== live.videoId){ live = { videoId:v, likes:0, celebrated: live.celebrated === v ? v : "", vcelebrated: live.vcelebrated === v ? v : "" }; held = null; }
        if (goal && goal.lastVideo !== v){
          // a new stream: each goal's streak survives only if the previous stream reached it
          Object.keys(goal.streaks).forEach(function(t){ if (goal.lastVideo && goal.best < +t) goal.streaks[t] = 0; });
          goal.lastVideo = v; goal.best = 0; goal.shownUpTo = 0; queuedTier = 0;
          setJSON(GOAL_KEY, goal).catch(function(){});
        }
        if (pendingSeed !== null && goal && goal.lastVideo === v){
          // the streak going INTO this stream; if this stream already reached 50, it counts too
          goal.streaks[String(goal.step)] = pendingSeed + (goal.best >= goal.step ? 1 : 0);
          goal.seedApplied = pendingSeed; pendingSeed = null;
          setJSON(GOAL_KEY, goal).catch(function(){});
          paint();
        }
        // after a restart: a goal reached but never shown (e.g. reached on the waiting page)
        if (goal && goal.lastVideo === v && goal.best > (goal.shownUpTo || 0) && queuedTier < goal.best){
          queuedTier = goal.best; celebrateGoal(Number(it.statistics && it.statistics.likeCount) || goal.best, goal.best);
        }
        if (it.statistics && it.statistics.likeCount != null) onLikes(Number(it.statistics.likeCount));
        var cv = it.liveStreamingDetails && it.liveStreamingDetails.concurrentViewers;
        if (status === "live" && cv != null) onViewers(Number(cv)); else { viewers = null; held = null; paintViewers(); }
        runParty();
      });
    }).catch(function(e){ console.warn("records:", e.message); });
  }

  function start(){
    getJSON(REC_KEY).then(function(r){
      record = r && r.likes;
      vrecord = (r && r.viewers) || { value:0, date:"" };
      subs = (r && r.subs) || null;
      var dirty = false;
      if (!record){
        var seed = parseInt(H.get("seed"), 10);
        record = { value: seed >= 0 ? seed : 0, date: H.get("seeddate") || today() };
        dirty = true;
      }
      // &vseed=N: starting viewers record, applied once per value
      // (value and date together, so adding the date later still applies)
      var vs = parseInt(H.get("vseed"), 10), vkey = vs + "|" + (H.get("vseeddate") || "");
      if (vs >= 0 && vkey !== String(vrecord.seedApplied) && !(String(vrecord.seedApplied) === String(vs) && !H.get("vseeddate"))){
        if (String(vrecord.seedApplied).split("|")[0] === String(vs) && vrecord.value !== vs){
          vrecord.date = vrecord.date || H.get("vseeddate") || "";   // record already beaten: keep it, don't roll back
        } else vrecord = { value:vs, date:H.get("vseeddate") || "", seedApplied:vkey };
        vrecord.seedApplied = vkey;
        dirty = true;
      }
      if (dirty) saveRecords().catch(function(){});
      return getJSON(GOAL_KEY);
    }).then(function(g){
      if (g && g.streaks){ goal = g; goal.step = GOAL; }
      else if (g && g.target){
        // saved by the single-goal version: carry its streak over
        goal = { step:GOAL, streaks:{}, lastVideo:g.lastVideo || "", best: g.lastHit ? g.target : 0, shownUpTo: g.lastHit && g.shown !== false ? g.target : 0 };
        goal.streaks[String(g.target)] = g.streak || 0;
        setJSON(GOAL_KEY, goal).catch(function(){});
      } else {
        goal = { step:GOAL, streaks:{}, lastVideo:"", best:0, shownUpTo:0 };
        setJSON(GOAL_KEY, goal).catch(function(){});
      }
      // &streak=N: applied once per value, when the current stream is found (see poll)
      var sv = parseInt(H.get("streak"), 10);
      if (sv >= 0 && String(sv) !== String(goal.seedApplied)) pendingSeed = sv;
      return getJSON(LIVE_KEY);
    }).then(function(l){
      if (l && l.videoId) live = l;   // picks up after a restart: no second celebration
      paint();
      if (TEST){
        // climbs past the goal, then jumps near the record and climbs past it
        status = "live";
        // climbs past the first two goals, then jumps near the record and climbs past it
        live = { videoId:"TEST", likes:Math.max(0, goal.step - 4), celebrated:"" };
        goal = { step:goal.step, streaks:JSON.parse(JSON.stringify(goal.streaks)), lastVideo:"TEST", best:0, shownUpTo:0 };
        var n = live.likes; paint();
        // viewers: climb from just under the record to past it (one-off spike first, which must NOT count)
        var vStart = vrecord.value, vn = Math.max(0, vStart - 3), vt = 0;
        var tv = setInterval(function(){
          vt++; var shown = (vt === 2) ? vStart + 20 : vn++;   // tick 2 is a spike
          onViewers(shown); if (vn > vStart + 4) clearInterval(tv);
        }, 1500);
        // subscribers: a regular milestone, then a big one (memory only: test mode saves nothing)
        if (!H.has("nosubs")){
          subs = { last:1800, count:1858 }; subsFirstCheck = false;
          setTimeout(function(){ onSubs(1902); }, 4000);
          setTimeout(function(){ onSubs(2001); }, 8000);
          if (SUBGOAL) paintSubBar(1858);
        }
        var recStart = record.value, end = Math.max(recStart, 2 * goal.step) + 3;   // fixed: the record rises as it's beaten
        var t = setInterval(function(){
          if (n >= goal.step + 1 && n < 2 * goal.step - 3) n = 2 * goal.step - 3;
          else if (n >= 2 * goal.step + 1 && n < recStart - 4 && recStart > 2 * goal.step) n = recStart - 4;
          else n += 1;
          onLikes(n); if (n > end) clearInterval(t);
        }, 1500);
        return;
      }
      poll(); setInterval(poll, 60000);
      pollSubs(); setInterval(pollSubs, SUBGOAL ? 30000 : 300000);
    }).catch(function(e){ console.warn("records start:", e.message); setTimeout(start, 15000); });
  }
  if (!URL_ || !TOK || (!KEY && !TEST)){ document.body.textContent = "Missing url / tok / key after the # in the link."; return; }
  start();
  followPark(); setInterval(followPark, 30000);
  window.__records = { onLikes:onLikes, onViewers:onViewers, onSubs:onSubs, pollSubs:pollSubs, subs:function(){ return subs; }, poll:poll, state:function(){ return { record:record, vrecord:vrecord, live:live, goal:goal, status:status }; } };
})();
</script>
<script>
/* Broadcast UI/UX, 2026-11-04: dock the subscriber bar under the like counter.
   Default when no &subpos is given (or &subpos=stack). Matches the counter's width
   and follows it as it grows; if the counter is hidden, the bar takes its place. */
(function(){
  var H = new URLSearchParams(location.hash.slice(1));
  var sp = H.get("subpos");
  if (sp && sp !== "stack") return;
  document.body.classList.add("sub-stack");
  var chip = document.getElementById("chip"), bar = document.getElementById("subbar");
  function dock(){
    var on = chip.classList.contains("on") && getComputedStyle(chip).display !== "none";
    var r = chip.getBoundingClientRect();
    if (on && r.height > 0){
      bar.style.top = Math.round(r.bottom + 10) + "px";
      bar.style.right = Math.round(innerWidth - r.right) + "px";
      bar.style.width = Math.round(r.width) + "px";
    } else { bar.style.top = "16px"; bar.style.right = "16px"; bar.style.width = ""; }
  }
  dock(); setInterval(dock, 500); addEventListener("resize", dock);

  // ---- compact by default; the phone's "Race to 2K" button plays the big moment ----
  // Sequence: big centre card (9 s) -> full sub ticket under the likes (HOLD_FULL s)
  // -> shrinks to the slim one-line bar. Trigger: any change to Upstash key
  // itpd_subs_hype_2026 (e.g. {"seq": n}) written by the phone chat page
  // (Stream Engineering). &hype in the link plays it once on load, for testing.
  var HOLD_FULL = (parseInt(H.get("subhold"), 10) || 25) * 1000;
  var URL_ = (H.get("url") || "").replace(/\/+$/, ""), TOK = H.get("tok") || "";
  bar.classList.add("mini");
  var busy = false;
  function num(id){ var t = (document.getElementById(id) || {}).textContent || ""; return parseInt(t.replace(/[^0-9]/g, ""), 10); }
  function short(n){ return n >= 1000 && n % 1000 === 0 ? (n / 1000) + "K" : n.toLocaleString(); }
  function stars(){
    var cols = ["#E0322B", "#FFD34E", "#22306B", "#D82A83"];
    for (var i = 0; i < 18; i++){
      var s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("class", "hstar");
      s.innerHTML = '<path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z" fill="' + cols[i % 4] + '"/>';
      var a = Math.PI * 2 * i / 18, r = 520 + (i % 3) * 90;
      s.style.setProperty("--dx", Math.round(Math.cos(a) * r) + "px"); s.style.setProperty("--dy", Math.round(Math.sin(a) * r * 0.6) + "px");
      document.body.appendChild(s);
      (function(el){ requestAnimationFrame(function(){ el.classList.add("go"); }); setTimeout(function(){ el.remove(); }, 1800); })(s);
    }
  }
  function playHype(){
    if (busy) return;
    var party = document.getElementById("party");
    if (party && party.classList.contains("show")){ setTimeout(playHype, 1000); return; }   // wait for a celebration to finish
    busy = true;
    var now = num("sbNow"), goal = num("sbGoal") || 2000, left = Math.max(0, goal - (now || 0));
    document.getElementById("hNow").textContent = (now || 0).toLocaleString();
    document.getElementById("hGoal").textContent = goal.toLocaleString();
    document.getElementById("hGoalShort").textContent = short(goal);
    var st = document.querySelector("#hype .hstamp");
    st.innerHTML = left > 0 ? '<small>ONLY</small><span id="hLeft">' + left.toLocaleString() + '</span><small>TO GO</small>'
                            : '<small>WE</small><span id="hLeft">DID</span><small>IT!</small>';
    document.querySelector("#hype .hk").textContent = left > 0 ? "THE RACE IS ON" : "FINISH LINE";
    document.getElementById("hGo").textContent = left > 0 ? "Hit subscribe and help us cross the finish line!" : "We crossed the finish line! Thank you, Daze crew!";
    var fill = document.getElementById("hFill"); fill.style.width = "0";
    var hype = document.getElementById("hype");
    bar.classList.add("hidden");
    hype.classList.remove("leave"); void hype.offsetWidth; hype.classList.add("show");
    stars();
    setTimeout(function(){ fill.style.width = Math.min(100, Math.round((now || 0) * 100 / goal)) + "%"; }, 50);
    setTimeout(function(){ hype.classList.add("leave"); }, 9000);
    setTimeout(function(){
      hype.classList.remove("show", "leave");
      bar.classList.remove("mini"); bar.classList.remove("hidden");          // full ticket under the likes
      setTimeout(function(){ bar.classList.add("mini"); busy = false; }, HOLD_FULL);   // then shrink
    }, 9700);
  }
  window.ITPDSubHype = playHype;   // handy for testing from the console
  var lastSeen = null;
  function pollHype(){
    if (!URL_ || !TOK) return;
    fetch(URL_ + "/get/itpd_subs_hype_2026", { cache:"no-store", headers:{ Authorization:"Bearer " + TOK } })
      .then(function(r){ return r.json(); })
      .then(function(d){
        var v = d && d.result ? String(d.result) : "";
        if (lastSeen !== null && v && v !== lastSeen) playHype();
        lastSeen = v;
      }).catch(function(){});
  }
  pollHype(); setInterval(pollHype, 3000);
  if (H.has("hype")) setTimeout(playHype, 3000);
})();
</script>
